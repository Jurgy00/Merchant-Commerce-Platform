server:
  port: 8080

spring:
  application:
    name: merchantplatform

  datasource:
    url: jdbc:h2:file:./data/merchantplatform
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
mpesa:
  consumer-key: ${MPESA_CONSUMER_KEY}
  consumer-secret: ${MPESA_CONSUMER_SECRET}
  short-code: ${MPESA_SHORT_CODE}
  passkey: ${MPESA_PASSKEY}
  callback-url: ${MPESA_CALLBACK_URL}
  auth-url: https://sandbox.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials
  stk-push-url: https://sandbox.safaricom.co.ke/mpesa/stkpush/v1/processrequest